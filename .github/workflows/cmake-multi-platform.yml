name: CMake on multiple platforms

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            c: gcc
            cxx: g++
          - os: ubuntu-latest
            c: clang
            cxx: clang++
          - os: windows-latest
            c: cl
            cxx: cl
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_C_COMPILER=${{ matrix.c }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_BUILD_TYPE=Release
          -DLIBZUPT_BUILD_PYTHON=OFF
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test on Linux
        if: runner.os == 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error --output-junit tests.xml
      - name: Check installed CMake package on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/install"
          mv "$RUNNER_TEMP/install" "$RUNNER_TEMP/relocated"
          cmake -S tests/package -B consumer -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/relocated"
          cmake --build consumer --parallel 2
          ctest --test-dir consumer --output-on-failure --no-tests=error
      - name: Build and test summary
        if: always()
        shell: bash
        env:
          BUILD_OS: ${{ runner.os }}
          BUILD_COMPILER: ${{ matrix.cxx }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Commit: `{os.environ['GITHUB_SHA']}`\n\n")
              summary.write(f"Platform: {os.environ['BUILD_OS']}; compiler: {os.environ['BUILD_COMPILER']}\n\n")
              result = Path('build/tests.xml')
              if result.exists():
                  root = ET.parse(result).getroot()
                  summary.write(f"Tests: {root.get('tests')}; failures: {root.get('failures')}; time: {root.get('time')} s\n")
              else:
                  summary.write('No test results produced. Windows currently receives build validation only.\n')
          PYTHON
