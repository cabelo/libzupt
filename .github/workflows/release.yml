name: Release validation

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Check release version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^#define LIBZUPT_VERSION_STRING "\([0-9.]*\)"/\1/p' include/libzupt_version.h)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLIBZUPT_BUILD_PYTHON=OFF -DLIBZUPT_BUILD_EXAMPLES=OFF -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure --no-tests=error --output-junit tests.xml
      - name: Stage and verify installed package
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/install"
          mv "$RUNNER_TEMP/install" "$RUNNER_TEMP/relocated"
          cmake -S tests/package -B consumer -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/relocated"
          cmake --build consumer --parallel 2
          ctest --test-dir consumer --output-on-failure --no-tests=error
      - name: Package Linux libraries
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir dist
          tar -czf "dist/libzupt-${RELEASE_VERSION}-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/relocated" .
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libzupt-${{ steps.version.outputs.value }}-linux-x86_64
          path: dist/*
          if-no-files-found: error
      # Publication is performed by the maintainer with their own GitHub token.
      # scripts/package-release.py creates the signed-tag source packages,
      # including the level-9 .zupt asset, before gh release create is run.
